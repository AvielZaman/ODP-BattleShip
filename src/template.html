<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> BattleShip</title>
</head>

<body>
    <div class="container">
        <div class="headers">
            <h1> Let's play BattleShip! </h1>
            <p> Place Your ships Chief!</p>
            <button id="reset-btn">Reset Game</button>
        </div>
        <div class="boards">
            <div class="human">
                <h2> Your board </h2>
                <div class="board"></div>
                <div class="ship-tray"></div>
                <button id="orientation-btn"> Horizontal</button>
            </div>

            <div class="enemy">
                <h2> Enemy's board </h2>
                <div class="board"></div>
            </div>
        </div>
    </div>
</body>

</html>
